<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#214f3c" flood-opacity=".11"/></filter>
    <marker id="route" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3987e8"/></marker>
    <marker id="pixel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c4dff"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;text-anchor:middle;fill:#19392e}
      .title{font-size:14px;font-weight:700}.small{font-size:11px;font-weight:500;fill:#71857d}.micro{font-size:10px;font-weight:650;fill:#60766d}.legend{font-size:10.5px;font-weight:600;fill:#687e75}.purple{fill:#6843c5}
    </style>
  </defs>

  <rect x="4" y="41" width="712" height="235" rx="25" fill="#edf5f1" stroke="#bfd2ca" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="micro" x="360" y="65">LAN-REACHABLE OUTBOUND PATH</text>

  <g filter="url(#shadow)">
    <rect x="22" y="113" width="108" height="104" rx="20" fill="#fff" stroke="#c6d7d0" stroke-width="1.25"/>
    <text class="title" x="76" y="147">Downstream</text>
    <text class="title" x="76" y="166">device</text>
    <text class="small" x="76" y="192">ordinary IP</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="178" y="88" width="177" height="154" rx="23" fill="#e3f4ec" stroke="#42a97f" stroke-width="1.75"/>
    <text class="title" x="266" y="120">Mac / OpenSurge</text>
    <rect x="195" y="138" width="143" height="38" rx="10" fill="#f8fcfa" stroke="#70bb99"/>
    <text class="micro" x="266" y="161">TUN + device rules</text>
    <rect x="195" y="188" width="143" height="38" rx="10" fill="#f8fcfa" stroke="#70bb99"/>
    <text class="micro" x="266" y="211">mihomo outbound</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="401" y="79" width="151" height="102" rx="20" fill="#f3effd" stroke="#8b68d3" stroke-width="1.5"/>
    <text class="title purple" x="476" y="111">Pixel Proxy</text>
    <text class="title purple" x="476" y="130">Gateway</text>
    <text class="small" x="476" y="156">SOCKS5 :1080 · HTTP :8080</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="401" y="205" width="151" height="57" rx="18" fill="#fff" stroke="#b9d0c7" stroke-width="1.25"/>
    <text class="title" x="476" y="229">VPN by Google</text>
    <text class="small" x="476" y="248">phone-side VPN</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="618" y="113" width="82" height="104" rx="20" fill="#fff8f1" stroke="#ef9b62" stroke-width="1.5"/>
    <text class="title" x="659" y="155">Internet</text>
    <text class="small" x="659" y="181">final exit</text>
  </g>

  <path d="M132 165H176" fill="none" stroke="#3987e8" stroke-width="4" stroke-linecap="round" marker-end="url(#route)"/>
  <path d="M357 137C376 114 384 113 399 116" fill="none" stroke="#7c4dff" stroke-width="4" stroke-linecap="round" marker-end="url(#pixel)"/>
  <path d="M476 183V202" fill="none" stroke="#7c4dff" stroke-width="4" stroke-linecap="round" marker-end="url(#pixel)"/>
  <path d="M554 232C582 231 596 210 616 189" fill="none" stroke="#7c4dff" stroke-width="4" stroke-linecap="round" marker-end="url(#pixel)"/>
  <path d="M357 194C452 196 525 175 616 166" fill="none" stroke="#3987e8" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#route)"/>

  <g transform="translate(142 315)"><path d="M0 0h34" stroke="#7c4dff" stroke-width="4"/><text class="legend" x="112" y="5">selected Pixel egress</text></g>
  <g transform="translate(410 315)"><path d="M0 0h34" stroke="#3987e8" stroke-width="3" stroke-dasharray="7 6"/><text class="legend" x="100" y="5">unmatched DIRECT</text></g>
</svg>
