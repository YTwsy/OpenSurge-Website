<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#214f3c" flood-opacity=".10"/></filter>
    <marker id="traffic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3987e8"/></marker>
    <marker id="service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef9b42"/></marker>
    <marker id="ipv6-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#805bc7"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;text-anchor:middle;fill:#19392e}
      .title{font-size:14px;font-weight:700}.small{font-size:11px;font-weight:500;fill:#758980}.micro{font-size:10px;font-weight:600;fill:#61776e}.module{font-size:11px;font-weight:650}.legend{font-size:10.5px;font-weight:600;fill:#687e75}.ipv6{fill:#7650ba}
    </style>
  </defs>
  <rect x="4" y="42" width="226" height="210" rx="24" fill="#edf5f1" stroke="#bfd2ca" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="micro" x="117" y="66">Upstream network</text>
  <rect x="492" y="42" width="224" height="210" rx="24" fill="#edf5f1" stroke="#bfd2ca" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="micro" x="604" y="66">Isolated Downstream LAN</text>

  <g filter="url(#shadow)">
    <rect x="16" y="126" width="76" height="78" rx="17" fill="#fff" stroke="#c6d7d0" stroke-width="1.25"/>
    <text class="title" x="54" y="158">Internet</text><text class="small" x="54" y="181">Public network</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="122" y="104" width="94" height="124" rx="19" fill="#fff" stroke="#b9d0c7" stroke-width="1.25"/>
    <text class="title" x="169" y="136">Router</text>
    <path d="M139 158h60" stroke="#d8e5df"/>
    <text class="small" x="169" y="181">DHCP on</text><text class="small" x="169" y="204">Unchanged</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="272" y="78" width="176" height="174" rx="24" fill="#e3f4ec" stroke="#42a97f" stroke-width="1.75"/>
    <text class="title" x="360" y="110">Mac / OpenSurge</text>
    <rect x="288" y="126" width="67" height="59" rx="11" fill="#f7fcf9" stroke="#69b994" stroke-width="1"/>
    <text class="module" x="321" y="149">Upstream</text><text class="small" x="321" y="170">To router</text>
    <rect x="365" y="126" width="67" height="59" rx="11" fill="#f7fcf9" stroke="#69b994" stroke-width="1"/>
    <text class="module" x="398" y="146">Downstream</text><text class="micro" x="398" y="164">DHCP + DNS</text><text class="micro ipv6" x="398" y="180">IPv6 RA</text>
    <rect x="288" y="194" width="144" height="42" rx="11" fill="#f7fcf9" stroke="#69b994" stroke-width="1"/>
    <text class="module" x="360" y="211">Rules &amp; forwarding</text><text class="micro" x="360" y="229">IPv4 TUN · <tspan class="ipv6">IPv6 userspace</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="506" y="104" width="86" height="124" rx="19" fill="#fff" stroke="#b9d0c7" stroke-width="1.25"/>
    <text class="title" x="549" y="139">AP / VLAN</text>
    <path d="M521 158h56" stroke="#d8e5df"/>
    <text class="small" x="549" y="181">Dedicated SSID</text><text class="small" x="549" y="204">Separate subnet</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="622" y="104" width="80" height="124" rx="19" fill="#fff8f1" stroke="#ef9b62" stroke-width="1.5"/>
    <text class="title" x="662" y="139">Clients</text>
    <text class="small" x="662" y="165">Automatic</text><text class="small" x="662" y="184">All connected</text><text class="micro ipv6" x="662" y="207">Optional IPv6</text>
  </g>

  <path d="M622 191H594" fill="none" stroke="#3987e8" stroke-width="4" stroke-linecap="round" marker-end="url(#traffic)"/>
  <path d="M506 191H450" fill="none" stroke="#3987e8" stroke-width="4" stroke-linecap="round" marker-end="url(#traffic)"/>
  <path d="M272 191H218" fill="none" stroke="#3987e8" stroke-width="4" stroke-linecap="round" marker-end="url(#traffic)"/>
  <path d="M122 165H94" fill="none" stroke="#3987e8" stroke-width="4" stroke-linecap="round" marker-end="url(#traffic)"/>
  <path d="M432 150C466 113 486 113 506 139" fill="none" stroke="#ef9b42" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#service)"/>
  <path d="M432 175C466 148 486 148 506 168" fill="none" stroke="#805bc7" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" marker-end="url(#ipv6-service)"/>
  <g>
    <rect x="439" y="73" width="177" height="28" rx="14" fill="#fff3e6" stroke="#f2be87"/>
    <circle cx="452" cy="87" r="3" fill="#ef9b42"/><text class="micro" x="465" y="91" style="text-anchor:start">Downstream DHCP / DNS only</text>
  </g>
  <g>
    <rect x="439" y="239" width="177" height="28" rx="14" fill="#f4effc" stroke="#c7b3e5"/>
    <circle cx="452" cy="253" r="3" fill="#805bc7"/><text class="micro ipv6" x="465" y="257" style="text-anchor:start">Optional downstream IPv6</text>
  </g>

  <g transform="translate(72 310)"><path d="M0 0h34" stroke="#3987e8" stroke-width="4"/><text class="legend" x="84" y="5">Device traffic</text></g>
  <g transform="translate(270 310)"><path d="M0 0h34" stroke="#ef9b42" stroke-width="3" stroke-dasharray="7 6"/><text class="legend" x="106" y="5">Downstream IPv4 DHCP / DNS</text></g>
  <g transform="translate(526 310)"><path d="M0 0h34" stroke="#805bc7" stroke-width="2.5" stroke-dasharray="6 6"/><text class="legend" x="88" y="5">Optional IPv6</text></g>
</svg>
